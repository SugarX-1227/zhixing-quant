# 知行量化系统配置
#
# 注意：原文件里 timing 和 portfolio 各出现过两次，YAML 后者覆盖前者，
# 前面那份是死配置（改了不生效）。本文件已合并去重，只保留实际生效的值。

# ---------------------------------------------------------------------------
# 数据源：本地通达信文件（不再走 MCP / 付费接口）
# ---------------------------------------------------------------------------
data:
  # 通达信安装目录，脚本会自动找它下面的 vipdoc
  # Windows 例: C:/new_tdx        Mac(Wine/CrossOver) 例: /Users/you/tdx
  tdx_install_dir: E:/Programs/tdx
  # 指南针数据目录（活跃市值 0AMV 来源），留空则自动扫常见盘符
  # 同步时需先退出指南针：python -m zhixing_quant.data.sync --oamv
  compass_dir: E:/Compass/WavMain/ANALYSE/Data/ChinaStk
  db_path: data/market.db
  markets: [sh, sz]
  include_bj: false          # 北交所，需要的话改 true 并把 bj 加进 markets

capital:
  initial_cash: 50000
  max_position_value: 25000

universe:
  min_daily_amount: 100000000    # 成交额下限，1 亿
  exclude_st: true
  exclude_new_stock_days: 60     # K线数少于此值视为次新，剔除
  exclude_boards: []             # 可填 STAR / CHINEXT / BSE，INDEX 永远排除
  max_candidates: 10

execution:
  signal_confirm: close
  entry_price: next_open
  abandon_gap_up: 0.07
  t_plus_1: true

regime:
  current: BEAR
  block_open_in_bear: false

report:
  lookback_bars: 120

# ---------------------------------------------------------------------------
# 指标参数
# ---------------------------------------------------------------------------
brick:
  n1: 4
  n2: 6
  # 绿转强红：红柱高度 >= 绿柱高度 × 2/3。
  # 这是使用者每天在通达信里实跑的那份选股公式的原文，仓库里
  # 通达信行情指标与选股指标(1).md 与 知行量化系统开发规划.docx 3.6 都一致。
  #
  # 2026-09 之前这里写的是「砖高 > 4 且 砖高 > 昨日砖高 × 1.5」，出处标的是
  # 一份不在本仓库的文档。它把「两个增量相比」错成「两个水平值相比」，
  # 又把 砖型图:=IF(VAR6A>4,VAR6A-4,0) 里已经扣过的 4 再要求一遍。
  # 实测 50 只 × 2.8 年：正确公式 1553 次信号，错误实现 1 次。
  min_height_ratio: 0.6667
  # 以下两项是可选附加门槛，0 = 关闭，不属于通达信公式
  min_brick_height: 0.0
  min_brick_growth: 0.0
  take_profit:
    red_streak_2: 0.10
    red_streak_3: 0.30
    red_streak_4: 0.50
  stop_loss:
    break_entry_low: true
    break_yellow_line: true

b1:
  # 黄线参数见 dual_line 段，此处不再重复声明
  rsi_n: 9
  j_threshold: 13
  chg_min: -4
  chg_max: 4

b2:
  # 黄线参数见 dual_line 段，此处不再重复声明
  rsi_n: 9
  exist_window: 3
  j_oversold: 13
  chg_min: 3.95
  j_threshold: 55

macd:
  fast: 12
  slow: 26
  signal: 9
  divergence_window: 60

volume_price:
  vol_ma_window: 5

key_kline:
  atr_window: 14
  lookback: 60

# 知行双线。全项目唯一定义，brick / b1 / b2 / key_kline / defense 都读这里。
# 附录 B.1：白线 = EMA(EMA(C,10),10)，黄线 = (MA14+MA28+MA57+MA114)/4。
# 曾经错写成 fast:10 / slow:20（单条 EMA10 与 MA20），导致防守层用 MA20
# 当生死线，破线次数多出四成。改这两个值等于换掉整套体系的骨架，慎动。
dual_line:
  white_span: 10
  yellow_ma_windows: [14, 28, 57, 114]

single_needle:
  n1: 10
  n2: 20

# S 系列卖点。2026-09 之前这一整段是死配置——signals/sell_s.py 把
# 2.0 / 0.6 / 0.02 硬编码在函数体里，改这里不会有任何反应。现已接通。
sell:
  s1_double_vol_threshold: 2.0
  s1_break_low_window: 5          # 跌破前 N 日最低（不含当日）
  s1_break_low_needs_volume: false  # 跌破前低是否也要求放量确认
  s2_white_break: true
  s3_big_bear_body_min: 0.6
  s3_gap_down_pct: 0.02

distribution:
  high_vol_multiplier: 1.8
  sky_vol_multiplier: 2.0
  near_high_pct: 0.97

# ---------------------------------------------------------------------------
# 择时（原文件重复两次，此处为合并后生效的一份）
# ---------------------------------------------------------------------------
timing:
  active_value:
    bear_drop: -0.023     # 单日跌幅超过此值 → 空头区间：禁开仓+次日开盘清仓
    bull_surge: 0.04      # 单日涨幅超过此值 → 强势多头
    bull_3day_sum: 0.04   # 连续3天全涨且单日涨幅简单相加超过此值 → 多头区间

# ---------------------------------------------------------------------------
# 仓位（原文件重复两次，此处为合并后生效的一份）
# ---------------------------------------------------------------------------
portfolio:
  risk_per_trade: 0.02
  kelly_fraction: 0.25
  bull_max_total: 1.0     # 多头区间满仓可用（单笔 20% × 5 槽）
  neutral_max_total: 0.50
  bear_max_total: 0.0
  per_position_pct:
    small_capital: 0.50
    medium_new: 0.10
    medium_expert: 0.20
    large: 0.07
  star_market_haircut: 0.5

# ---------------------------------------------------------------------------
# 回测
# ---------------------------------------------------------------------------
backtest:
  initial_capital: 500000
  commission: 0.00025        # 佣金率
  commission_min: 5          # 最低佣金 5 元
  stamp_tax: 0.001           # 印花税，仅卖出
  transfer_fee: 0.00001      # 过户费
  slippage: 0.0015           # 滑点
  limit_up_pct: 0.10         # 主板涨跌停
  limit_up_chi_next: 0.20    # 创业板
  limit_up_star: 0.20        # 科创板
  max_positions: 5
  max_holding_days: 20       # 仅在未启用 exits 段时生效，见下方 exits.*.time_stop
  max_entries_per_day: 2
  # 仓位口径。equal = 剩余现金按空槽等分（旧回测行为，与止损位无关，
  # 每笔真实风险敞口差异极大）；risk = 走 portfolio.PositionSizer 的
  # 风险头寸公式（仓位随止损距离变化，通常很小）；pct = 每笔固定
  # 权益比例（position_pct），被择时总仓位上限封顶。
  sizing: pct
  position_pct: 0.20        # 单笔目标市值 = 权益 × 20%
  # 回测里是否套用择时区间的总仓位上限（牛 1.0 / 中性 0.50 / 空 0）。
  # 此前只有实盘套，回测只做了空头禁开仓，两边口径不一致。
  apply_regime_cap: true

# ---------------------------------------------------------------------------
# 出场规则（止损 / 移动止损 / 止盈 / 时间止损）
#
# 回测引擎和实盘防守都读这一段，改一处两边同时生效。
# `default` 是所有战法的缺省，`<战法名>` 逐项覆盖（深合并，只写要改的键）。
#
# 在此之前回测的出场是写死的：信号日低点止损 + 15% 固定止盈 + 满 20 日清仓，
# 战法自己的 exit_conditions 一次都没被调用过。default 段刻意保持与那套
# 写死规则一致，这样加上 exits 段之后老结果仍可复现；要改行为就往下面的
# 战法段里写。
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 因子排序
#
# 战法信号决定「能不能买」（布尔），因子打分决定「先买哪只」（连续值）。
# 此前命中后一律按成交额降序截断——成交额只是流动性代理，和这只票接下来
# 会不会涨没有任何关系。命中 50 只只能买 5 只时，按成交额挑等于随机挑。
#
# ranking 可选：amount（旧口径）/ trend / pullback / breakout /
#               liquidity_only / custom（用下面的 weights）
# by_strategy 按战法单独指定，优先级高于 ranking。
#
# ⚠️ 预设权重是**初始猜测值**，必须用「因子」页的 IC / 分层收益校准后再信。
# ---------------------------------------------------------------------------
factors:
  ranking: amount
  by_strategy:
    b1: pullback       # B1 是回踩买点，偏好贴近黄线、中期仍强、短线刚回调
    b2: breakout       # B2 是确认阳线，偏好放量、逼近新高
    brick: breakout
  weights: {}          # ranking: custom 时生效，如 {mom_20: 1.0, atr_pct: 0.5}
  evaluate:
    horizon: 5         # IC 用未来几个交易日的收益
    quantiles: 5       # 分层收益分几层

# ---------------------------------------------------------------------------
# 建仓规则（底仓比例 + 分批加仓）
#
# 规划书 6.2.1「B1 五步循环」的第 1、3 步。此前完全没有实现：引擎一只标的
# 只建一次仓，`code in positions` 直接跳过，同一只票再出 B1 也不会加仓；
# 建仓规模走的是风险头寸公式，不是「底仓 10-20%」这种固定比例。
#
# base_pct = 0 表示回落到 backtest.sizing 的口径（风险头寸 / 等权）。
# ---------------------------------------------------------------------------
entries:
  default:
    base_pct: 0.0        # 底仓占权益比例，0 = 用 backtest.sizing 的口径
    addon_pct: 0.0       # 每次同向信号加仓比例，0 = 不加仓
    max_addons: 0
    addon_min_gain: -1.0 # 加仓前最低浮盈，-1.0 = 不设门槛

  # 规划书 6.2.1：B1 建底仓 10-20%，区间内每出现一次 sig_b1 加 5%，最多 4 次。
  # 满仓状态 = 15% + 4×5% = 35%。
  b1:
    base_pct: 0.15
    addon_pct: 0.05
    max_addons: 4

exits:
  default:
    stop:
      kind: entry_low      # entry_low / pct / atr / none
      pct: 0.08            # kind=pct 时生效
      atr_mult: 2.0        # kind=atr 时生效
      atr_window: 14
      buffer: 0.0          # 止损价再向下让出的比例，防日内插针扫损
      cap_pct: 0.99        # 止损价上限 = 入场价 × 此值，不许贴着成本
    trailing:
      kind: none           # none / pct / chandelier / yellow_line
      pct: 0.10
      atr_mult: 3.0
      activate_profit: 0.0 # 浮盈达到此比例后才启用移动止损
    take_profit:
      kind: pct            # pct / none / tiered
      pct: 0.15
    time_stop:
      max_holding_days: 20
      no_progress_days: 0  # 持仓 N 日涨幅不足 min_progress 就走，0=关闭
      min_progress: 0.0
    break_yellow_line: false
    defense_ladder: false  # 启用 portfolio/defense.py 八级阶梯
    strategy_exit: false   # 调用战法自身 exit_conditions

  # 砖型图：规划书 6.4.2「四块砖止盈定律」——连 2 根减 10%、连 3 根减 30%、
  # 连 4 根清仓；跌破入场 K 线低点或跌破黄线全清。
  brick:
    stop:
      kind: entry_low
    take_profit:
      kind: tiered
      tiers:
        2: 0.10
        3: 0.30
        4: 1.00
    time_stop:
      max_holding_days: 6
    break_yellow_line: true

  # B1/B2 出场体系（2026-09 使用者定的口径）：
  #   分批止盈：涨 8% 卖 1/3，涨 20% 再卖 1/3，剩余跌破白线全走（白线移动
  #             止损在浮盈 8% 后启用——前两档止盈落袋后兜底离场）
  #   单次止损（收盘确认，次日开盘清仓）：跌破黄线 / 盈转亏（浮盈曾超 2%
  #             后收盘跌回成本）/ 低低走人（浮盈曾超 5% 后收盘 < 前一日最低）
  #   多头转空头由择时闸门处理（引擎在空头日开盘强制清仓），不在此配置。
  #   不设初始价位止损、不限最长持有天数。
  # 2026-09 复核：以下改为规划书 6.2.1「B1 五步循环」的原始口径。
  #   1) B1 建底仓 10-20%            -> entries.b1.base_pct
  #   2) 横盘期拿住（不破白线不动）    -> 不设初始止损、不限持有天数
  #   3) 区间内分批加仓               -> entries.b1.addon_pct / max_addons
  #   4) 脱离成本 5%+ 放飞底仓的 1/3  -> price_tiers 第一档 gain 0.05
  #   5) 破白线减半，破黄线全清        -> white_line_break 0.5 + break_yellow_line
  #
  # 与改动前（使用者实测调出来的那版）的差异，改回去只需三行：
  #   - 放飞门槛 8% -> 5%（规划书写的是「脱离成本 5%+」）
  #   - 破白线从「移动止损全出」改成「减半」，剩余半仓交给破黄线
  #   - 去掉 +20% 第二档（规划书只有一次放飞；要保留就把那行加回 price_tiers）
  # 盈转亏 / 低低走人是使用者加的，规划书没写但不冲突，保留。
  b1:
    stop:
      kind: none
    trailing:
      kind: none
    take_profit:
      kind: price_tiers
      price_tiers:
        - {gain: 0.05, sell: 0.33}
    time_stop:
      max_holding_days: 0
    white_line_break: 0.5
    break_yellow_line: true
    profit_to_loss: 0.02
    close_below_prev_low: 0.05

  b2:
    # B2 确认阳线入场，买点离黄线远；没有初始止损时，一笔直接下跌的单子
    # 要一路跌到黄线才走（2026-09 实测 20% 仓位下单笔可亏 10%+，整段回测
    # -19.7%）。用入场 K 线最低价做灾难兜底，留 5% 缓冲防正常回踩被扫
    # （无缓冲实测 39 笔里 27 笔被扫出，胜率掉到 20%；缓冲 5% 后只扫 7 笔）。
    stop:
      kind: entry_low
      buffer: 0.05
    trailing:
      kind: white_line
      activate_profit: 0.08
    take_profit:
      kind: price_tiers
      price_tiers:
        - {gain: 0.08, sell: 0.33}
        - {gain: 0.20, sell: 0.33}
    # 规划书 4.3.2：sig_b2_hold_max 默认 2，「仅允许休整 1 天」；
    # 6.3 共享出场第 3 条：2 个交易日内未大幅拉升 → 全清。
    # 改动前这里是 max_holding_days: 0（完全不限），B2 是爆发型确认阳线，
    # 不拉升就说明判断错了，拖着只会把小亏拖成大亏。
    time_stop:
      max_holding_days: 0
      no_progress_days: 2
      min_progress: 0.03
    break_yellow_line: true
    profit_to_loss: 0.02
    close_below_prev_low: 0.05
    # 规划书 6.3 共享出场第 1、4 条：S1 减 50%、主力出货减 50%。
    # 只开阶梯里这两级——破白线/破黄线/止损止盈上面已有显式规则，
    # 全开会两边打架。runner 会按 required_steps 自动把
    # sell_s / distribution / volume_price 并进指标流水线。
    defense_ladder: true
    defense_rules: [s1, distribution]
    defense_s1_portion: 0.5
    defense_distribution_portion: 0.5

strategies:
  brick:
    take_profit:
      red_streak_2: 0.10
      red_streak_3: 0.30
      red_streak_4: 0.50
    stop_loss:
      break_entry_low: true
      break_yellow_line: true
  b2:
    modes:
      - parallel_heavy_cannon
      - post_disaster
      - eager_to_try
  yoga_pants:
    allow_b3_addon: true

executor:
  max_open_per_day: 1
  pre_order_check: true
