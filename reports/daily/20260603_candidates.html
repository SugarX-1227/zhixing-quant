<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>知行砖型图每日选股 20260603</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2933;
      background: #f5f7fa;
    }
    header {
      padding: 24px 32px 16px;
      background: #ffffff;
      border-bottom: 1px solid #d9e2ec;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .summary { color: #52606d; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .candidate {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      margin-bottom: 18px;
      padding: 18px;
    }
    h2 { margin: 0 0 10px; font-size: 18px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .meta span {
      background: #eef2f7;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
    }
    .reason { margin: 10px 0 0; color: #52606d; font-size: 14px; }
    .empty { background: #fff; border: 1px solid #d9e2ec; padding: 18px; border-radius: 8px; }
    svg { width: 100%; height: auto; display: block; }
    .axis { stroke: #bcccdc; stroke-width: 1; }
    .line-yellow { fill: none; stroke: #d99a00; stroke-width: 1.6; }
    .line-close { fill: none; stroke: #243b53; stroke-width: 1.4; }
    .brick-red { fill: #d64545; }
    .brick-green { fill: #2f9e44; }
    .marker { fill: #0b7285; }
  </style>
</head>

  <header>

</html>
